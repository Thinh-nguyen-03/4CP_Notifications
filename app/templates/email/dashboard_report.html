<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ERCOT 4CP Forecast — SENERGY</title>
    <!--[if mso]>
    <style type="text/css">
        body, table, td {font-family: Arial, Helvetica, sans-serif !important;}
    </style>
    <![endif]-->
</head>
<body style="margin: 0; padding: 0; font-family: Arial, Helvetica, 'Segoe UI', sans-serif; background-color: #f5f6f8;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f5f6f8;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <table border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #ffffff; border: 1px solid #e4e6ea; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);">

                    <!-- Logo (color logo on white — matches app/static/senergy-logo.png) -->
                    <tr>
                        <td align="center" bgcolor="#ffffff" style="padding: 28px 40px 24px 40px; background-color: #ffffff;">
                            <img src="{{ logo_url }}" alt="SENERGY — Powered by Schneider Engineering" width="280" style="display: block; border: 0; max-width: 100%; height: auto;" />
                        </td>
                    </tr>

                    <!-- Gold accent (dashboard --gold) -->
                    <tr>
                        <td style="height: 8px; line-height: 8px; font-size: 0; background-color: #f4b942; padding: 0; margin: 0;">&nbsp;</td>
                    </tr>

                    <!-- Title (yellow box) + date + subtle slot line (single navy band) -->
                    <tr>
                        <td align="center" bgcolor="#0f1a2f" style="padding: 24px 40px 22px 40px; background-color: #0f1a2f;">
                            <table border="0" cellpadding="0" cellspacing="0" align="center" style="margin: 0 auto;">
                                <tr>
                                    <td style="border: 2px solid #f4b942;">
                                        <table border="0" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td bgcolor="#f9d27e" align="center" style="padding: 12px 22px 14px 22px;">
                                                    <p style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: bold; font-style: italic; color: #1a2a4a; letter-spacing: 0.2px; line-height: 1.25;">
                                                        ERCOT 4CP 7-Day Forecast
                                                    </p>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin: 16px 0 0 0; font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: normal; font-style: normal; color: rgba(255,255,255,0.92);">
                                {{ date_str }}
                            </p>
                            <p style="margin: 8px 0 0 0; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: normal; letter-spacing: 0.08em; color: rgba(255,255,255,0.58);">
                                {{ report_version }}
                            </p>
                            <table border="0" cellpadding="0" cellspacing="0" width="200" align="center" style="margin: 16px auto 0 auto;">
                                <tr>
                                    <td bgcolor="#f4b942" style="height: 3px; line-height: 3px; font-size: 0;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="height: 28px; line-height: 28px; font-size: 0;">&nbsp;</td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td align="center" style="padding: 0 48px; font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 24px; color: #475569;">
                            <p style="margin: 0;">Access your ERCOT 4CP 7-Day forecast for {{ date_str }} below.</p>
                        </td>
                    </tr>

                    <tr>
                        <td style="height: 32px; line-height: 32px; font-size: 0;">&nbsp;</td>
                    </tr>

                    <!-- CTA (navy like dashboard primary actions) -->
                    <tr>
                        <td align="center" style="padding: 0 40px;">
                            <table border="0" cellpadding="0" cellspacing="0" style="border: 3px solid #1a2a4a;">
                                <tr>
                                    <td bgcolor="#1a2a4a" align="center" style="padding: 15px 32px;">
                                        <a href="{{ dashboard_url }}" target="_blank" style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; color: #ffffff; text-decoration: none; display: block; letter-spacing: 0.5px;">
                                            View Report &rarr;
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="height: 28px; line-height: 28px; font-size: 0;">&nbsp;</td>
                    </tr>

                    <tr>
                        <td style="padding: 0 50px;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td bgcolor="#e4e6ea" style="height: 1px; line-height: 1px; font-size: 0;">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="height: 32px; line-height: 32px; font-size: 0;">&nbsp;</td>
                    </tr>

                    <tr>
                        <td align="center" style="padding: 0 40px; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: bold; color: #475569;">
                            Questions about your report?
                        </td>
                    </tr>

                    <tr>
                        <td style="height: 18px; line-height: 18px; font-size: 0;">&nbsp;</td>
                    </tr>

                    <tr>
                        <td align="center" style="padding: 0 40px 40px 40px;">
                            <table border="0" cellpadding="0" cellspacing="0" style="border: 3px solid #f4b942;">
                                <tr>
                                    <td bgcolor="#f4b942" align="center" style="padding: 12px 34px;">
                                        <a href="{{ contact_href }}" style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: bold; color: #1a2a4a; text-decoration: none; display: block; letter-spacing: 0.4px;">
                                            CONTACT US
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
